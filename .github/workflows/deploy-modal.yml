name: Deploy Modal backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Modal environment to deploy
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
permissions:
  contents: read

concurrency:
  group: modal-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: modal-${{ inputs.environment }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-modal.txt

      - name: Install deployment dependencies
        run: python -m pip install -r backend/requirements-modal.txt

      - name: Check Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          python -m modal --version

      - name: Build images, prepare models, and deploy
        run: python -m modal deploy --env "$MODAL_ENVIRONMENT" backend/modal_app.py
